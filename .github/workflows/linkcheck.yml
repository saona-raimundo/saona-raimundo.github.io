name: Link check

on:
  workflow_run:
    workflows: ["Build & deploy Jekyll site"]
    types: [completed]
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # so lychee picks up .lycheeignore

      - name: List published pages from sitemap
        id: pages
        run: |
          urls=$(curl -fsSL https://saona-raimundo.github.io/sitemap.xml \
                 | grep -oP '(?<=<loc>)[^<]+' | tr '\n' ' ')
          echo "urls=$urls" >> "$GITHUB_OUTPUT"

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-concurrency 8
            --accept 200..=299,429
            ${{ steps.pages.outputs.urls }}
