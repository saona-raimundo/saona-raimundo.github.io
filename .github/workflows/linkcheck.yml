name: Link check

on:
  workflow_run:
    workflows: ["Build & deploy Jekyll site"]
    types: [completed]
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5   # so lychee picks up .lycheeignore

      # Written to a file because lychee-action evals its args, so URLs with
      # ( ) & ' break the shell. PDFs have no links to extract; they are still
      # checked as link targets from the pages.
      - name: List published pages from sitemap
        run: |
          curl -fsSL https://saona-raimundo.github.io/sitemap.xml \
            | python3 -c 'import html, re, sys; print(*(html.unescape(u) for u in re.findall(r"<loc>([^<]+)</loc>", sys.stdin.read())), sep="\n")' \
            | grep -v '\.pdf$' > pages.txt

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-concurrency 8
            --max-retries 3
            --retry-wait-time 5
            --timeout 30
            --accept 200..=299,429
            --files-from pages.txt
